name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup test ground truth
        run: |
          mkdir -p server_data
          if [ ! -f server_data/private_answers.csv ]; then
            cp tests/fixtures/sample_predictions.csv server_data/private_answers.csv
          fi

      - name: Run test suite
        run: npm test
